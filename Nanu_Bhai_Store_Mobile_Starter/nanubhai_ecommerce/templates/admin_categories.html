{% extends "admin_base.html" %}{% block title %}Categories — Admin{% endblock %}{% block admin_content %}<div class="admin-heading"><div><p class="eyebrow">CATALOGUE</p><h1>Categories</h1></div></div><form class="form-card form-inline" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New category name<input name="name" required maxlength="80" placeholder="e.g. Electronics"></label><button class="btn">Create Category</button></form><div class="table-wrap"><table><thead><tr><th>Category</th><th>Slug</th><th>Products</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.slug }}</td><td>{{ c.products|length }}</td></tr>{% else %}<tr><td colspan="3">No categories yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
