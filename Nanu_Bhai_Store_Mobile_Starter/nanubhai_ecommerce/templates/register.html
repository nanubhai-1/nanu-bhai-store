{% extends "base.html" %}{% block title %}Create Account — {{ store_name }}{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-art"><span>✨</span><h2>Shop smart.</h2><p>Create an account to manage your orders.</p></div><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">JOIN NANU BHAI STORE</p><h1>Create Account</h1><label>Full name<input name="name" maxlength="100" required autocomplete="name"></label><label>Email address<input type="email" name="email" maxlength="160" required autocomplete="email"></label><label>Password <small>(at least 8 characters)</small><input type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label><button class="btn full">Create Account</button><p class="auth-bottom">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></section>{% endblock %}
