{% extends "admin_base.html" %}{% block title %}{{ 'Edit' if product.id else 'Add' }} Product — Admin{% endblock %}{% block admin_content %}<div class="admin-heading"><div><p class="eyebrow">CATALOGUE MANAGEMENT</p><h1>{{ 'Edit Product' if product.id else 'Add Product' }}</h1></div><a href="{{ url_for('admin_products') }}">← Back to products</a></div><form class="form-card form-narrow" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="name" required maxlength="160" value="{{ product.name or '' }}"></label><label>Description<textarea name="description" rows="5" maxlength="10000">{{ product.description or '' }}</textarea></label><div class="form-grid"><label>Price (₹)<input type="number" name="price" min="1" required value="{{ product.price or '' }}"></label><label>Compare price (₹)<input type="number" name="compare_price" min="1" value="{{ product.compare_price or '' }}"></label><label>Stock<input type="number" name="stock" min="0" required value="{{ product.stock if product.id else 0 }}"></label><label>SKU<input name="sku" maxlength="80" value="{{ product.sku or '' }}"></label></div><label>Category<select name="category_id"><option value="">No category</option>{% for c in categories %}<option value="{{ c.id }}" {% if product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Product image (PNG/JPG/WEBP/GIF, max 3 MB)<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp,.gif"></label>{% if product.image_url %}<img class="form-preview" src="{{ product.image_url }}" alt="Current product image">{% endif %}<label class="check"><input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %}> Featured product</label><label class="check"><input type="checkbox" name="is_active" {% if not product.id or product.is_active %}checked{% endif %}> Active / visible</label><button class="btn full">Save Product</button></form>{% endblock %}
